name: Apply M365 verification wave

on:
  push:
    paths:
      - ".github/workflows/apply-m365-wave.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode candidate tree
        shell: pwsh
        run: |
          $chunks = Get-ChildItem tools/s8/.wave/chunk_* | Sort-Object Name
          if ($chunks.Count -ne 5) { throw "Expected 5 payload chunks; found $($chunks.Count)." }
          $b64 = ($chunks | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'system8-m365-wave.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          Expand-Archive $zip -DestinationPath . -Force
          Remove-Item tools/s8/.wave -Recurse -Force
      - name: Commit candidate
        shell: pwsh
        run: |
          git config user.name "system8-ci"
          git config user.email "system8-ci@users.noreply.github.com"
          git add -A
          git commit -m "Complete M365 package verification wave"
          git push

# Triggered after payload staging.
