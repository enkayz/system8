name: M365 package verification

on:
  push:
    paths:
      - "tools/s8/packages/**"
      - "tools/s8/manifests/**"
      - "tests/**"
      - ".github/workflows/m365-packages.yml"
  workflow_dispatch:

jobs:
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests under PowerShell 7
        shell: pwsh
        run: ./tests/Test-M365Packages.ps1

  windows-powershell-5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests under Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-M365Packages.ps1
